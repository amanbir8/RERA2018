<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2200" viewBox="0 0 1700 2200">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill:#0f172a; }
      .node { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:10; ry:10; }
      .decision { fill:#fff7ed; stroke:#9a3412; stroke-width:2; }
      .text { font: 16px Arial, sans-serif; fill:#111827; }
      .small { font: 14px Arial, sans-serif; fill:#1f2937; }
      .arrow { stroke:#475569; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .label { font: 13px Arial, sans-serif; fill:#334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <text x="850" y="45" text-anchor="middle" class="title">Form-M Debug Flowchart</text>

  <!-- Main vertical flow -->
  <rect class="node" x="560" y="90" width="580" height="60"/>
  <text class="text" x="850" y="127" text-anchor="middle">GET Complaint/RegComplaintFormM</text>

  <rect class="node" x="520" y="190" width="660" height="80"/>
  <text class="text" x="850" y="225" text-anchor="middle">Load profile + existing draft + facts-case mode</text>
  <text class="small" x="850" y="248" text-anchor="middle">(DisplayComplaintProfileDetail, Display_ComplaintFormM_Registration_StepI, etc.)</text>

  <polygon class="decision" points="850,320 1020,410 850,500 680,410"/>
  <text class="text" x="850" y="404" text-anchor="middle">Save/Update</text>
  <text class="text" x="850" y="426" text-anchor="middle">Step-1?</text>

  <rect class="node" x="550" y="550" width="600" height="70"/>
  <text class="text" x="850" y="592" text-anchor="middle">POST Complaint/RegComplaintFormM</text>

  <rect class="node" x="520" y="655" width="660" height="80"/>
  <text class="text" x="850" y="690" text-anchor="middle">Verify facts-case mode (mPDF / mTEXT)</text>
  <text class="small" x="850" y="713" text-anchor="middle">Verify_ComplaintFormM_FactsOfTheCase_Documents_ByProfileID</text>

  <rect class="node" x="500" y="770" width="700" height="80"/>
  <text class="text" x="850" y="805" text-anchor="middle">Encode unregistered-project fields</text>
  <text class="small" x="850" y="828" text-anchor="middle">fnSaveSubStringUnRegdComplaint</text>

  <polygon class="decision" points="850,900 1020,990 850,1080 680,990"/>
  <text class="text" x="850" y="984" text-anchor="middle">Save or</text>
  <text class="text" x="850" y="1006" text-anchor="middle">Update?</text>

  <rect class="node" x="200" y="1130" width="560" height="80"/>
  <text class="text" x="480" y="1165" text-anchor="middle">Add_ComplaintFormM_Registration_StepI</text>
  <text class="small" x="480" y="1188" text-anchor="middle">(new draft/create)</text>

  <rect class="node" x="940" y="1130" width="560" height="80"/>
  <text class="text" x="1220" y="1165" text-anchor="middle">Update_ComplaintFormM_Registration_StepI</text>
  <text class="small" x="1220" y="1188" text-anchor="middle">(existing draft/edit)</text>

  <rect class="node" x="500" y="1260" width="700" height="80"/>
  <text class="text" x="850" y="1295" text-anchor="middle">Resolve next step</text>
  <text class="small" x="850" y="1318" text-anchor="middle">Get_ComplaintFormM_FlagStep</text>

  <polygon class="decision" points="850,1385 1050,1490 850,1595 650,1490"/>
  <text class="text" x="850" y="1484" text-anchor="middle">Step Flag</text>
  <text class="small" x="850" y="1506" text-anchor="middle">Step1M / Step2M / Step3M / Step4M</text>

  <rect class="node" x="40" y="1670" width="360" height="70"/>
  <text class="text" x="220" y="1710" text-anchor="middle">Step1M: RegComplaintFormM</text>

  <rect class="node" x="450" y="1670" width="360" height="70"/>
  <text class="text" x="630" y="1710" text-anchor="middle">Step2M: RegComplaintEncldocM</text>

  <rect class="node" x="860" y="1670" width="360" height="70"/>
  <text class="text" x="1040" y="1710" text-anchor="middle">Step3M: RequestPaymentFormM</text>

  <rect class="node" x="1270" y="1670" width="360" height="70"/>
  <text class="text" x="1450" y="1710" text-anchor="middle">Step4M: RegComplaintVerificationM</text>

  <!-- Step2 detail -->
  <rect class="node" x="420" y="1810" width="420" height="60"/>
  <text class="small" x="630" y="1847" text-anchor="middle">POST RegComplaintEncldocFormM (Proceed)</text>

  <polygon class="decision" points="630,1905 760,1975 630,2045 500,1975"/>
  <text class="small" x="630" y="1970" text-anchor="middle">Docs complete?</text>

  <rect class="node" x="850" y="1940" width="380" height="70"/>
  <text class="small" x="1040" y="1982" text-anchor="middle">Yes -> RequestPaymentFormM</text>

  <rect class="node" x="380" y="2080" width="500" height="70"/>
  <text class="small" x="630" y="2122" text-anchor="middle">No -> Back to RegComplaintEncldocM with error</text>

  <!-- Step4 detail -->
  <rect class="node" x="1230" y="1810" width="440" height="70"/>
  <text class="small" x="1450" y="1852" text-anchor="middle">POST RegComplaintVerificationM (Submit)</text>

  <rect class="node" x="1210" y="1920" width="480" height="70"/>
  <text class="small" x="1450" y="1962" text-anchor="middle">ValidateComplaintFormM_AgreeDetails</text>

  <rect class="node" x="1210" y="2030" width="480" height="70"/>
  <text class="small" x="1450" y="2072" text-anchor="middle">UpdateComplaintFormM_AgreeDetails + SendEmailAsync</text>

  <!-- Side flows from Step1 -->
  <rect class="node" x="50" y="560" width="380" height="60"/>
  <text class="small" x="240" y="597" text-anchor="middle">Add/View more Complainant (modal)</text>
  <rect class="node" x="50" y="640" width="380" height="90"/>
  <text class="small" x="240" y="675" text-anchor="middle">RegAdditionalComplaintFormM</text>
  <text class="small" x="240" y="700" text-anchor="middle">SaveComplainantFormMDetail /</text>
  <text class="small" x="240" y="720" text-anchor="middle">Delete_AdditionalComplaintFormM</text>

  <rect class="node" x="1270" y="560" width="380" height="60"/>
  <text class="small" x="1460" y="597" text-anchor="middle">Add/View more Respondent (modal)</text>
  <rect class="node" x="1270" y="640" width="380" height="90"/>
  <text class="small" x="1460" y="675" text-anchor="middle">RegAdditionalRespondentFormM</text>
  <text class="small" x="1460" y="700" text-anchor="middle">SaveRespondentFormMDetail /</text>
  <text class="small" x="1460" y="720" text-anchor="middle">Delete_AdditionalRespondentFormM</text>

  <rect class="node" x="120" y="820" width="360" height="80"/>
  <text class="small" x="300" y="855" text-anchor="middle">Facts-case file actions</text>
  <text class="small" x="300" y="878" text-anchor="middle">Upload / View / Delete / Download</text>

  <!-- Arrows -->
  <path class="arrow" d="M850 150 L850 190"/>
  <path class="arrow" d="M850 270 L850 320"/>
  <path class="arrow" d="M850 500 L850 550"/>
  <path class="arrow" d="M850 620 L850 655"/>
  <path class="arrow" d="M850 735 L850 770"/>
  <path class="arrow" d="M850 850 L850 900"/>
  <path class="arrow" d="M760 1020 L480 1130"/>
  <path class="arrow" d="M940 1020 L1220 1130"/>
  <path class="arrow" d="M480 1210 L760 1260"/>
  <path class="arrow" d="M1220 1210 L940 1260"/>
  <path class="arrow" d="M850 1340 L850 1385"/>

  <path class="arrow" d="M760 1540 L220 1670"/>
  <path class="arrow" d="M810 1580 L630 1670"/>
  <path class="arrow" d="M890 1580 L1040 1670"/>
  <path class="arrow" d="M940 1540 L1450 1670"/>

  <path class="arrow" d="M630 1740 L630 1810"/>
  <path class="arrow" d="M630 1870 L630 1905"/>
  <path class="arrow" d="M735 1980 L850 1980"/>
  <path class="arrow" d="M630 2045 L630 2080"/>

  <path class="arrow" d="M1450 1740 L1450 1810"/>
  <path class="arrow" d="M1450 1880 L1450 1920"/>
  <path class="arrow" d="M1450 1990 L1450 2030"/>

  <path class="arrow" d="M680 410 L430 590"/>
  <path class="arrow" d="M1020 410 L1270 590"/>
  <path class="arrow" d="M700 600 L430 850"/>

  <text class="label" x="610" y="1120">Save</text>
  <text class="label" x="1060" y="1120">Update</text>
</svg>
